<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Esploratore locale del vocabolario CityGML 3.0 dagli schemi XSD ufficiali OGC. Ricerca, proprieta e relazioni con provenienza verificabile.">
  <title>CityGML Explorer</title>
  <script>/* Display options saved by assets/app.js, applied before the first paint. */
    try { var root = document.documentElement, theme = localStorage.getItem('cg-theme') || 'light';
      if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.dataset.theme = theme; root.style.setProperty('--font-scale', parseFloat(localStorage.getItem('cg-font-scale')) || 1);
    } catch (_) {}</script>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/styles-dark.css">
  <script defer src="data/catalog.js"></script>
  <script defer src="codelists/codelists.default.js"></script>
  <script defer src="codelists/codelists.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body>
<a class="skip-link" href="#content">Vai alla scheda del concetto</a>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Navigazione del vocabolario">
    <a class="brand" href="#" id="home-link" aria-label="CityGML Explorer, Building">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><strong>CityGML</strong><small>VOCABULARY EXPLORER</small></span>
      <span class="version">3.0</span>
    </a>
    <div class="sidebar-tools">
      <label class="search-box" for="search"><span aria-hidden="true">&#9906;</span><input id="search" type="search" autocomplete="off" placeholder="Cerca un concetto..." aria-label="Cerca nome, etichetta o identificatore"><kbd>/</kbd></label>
      <label class="filter-label" for="family">SCHEMI</label>
      <select id="family"><option value="CityGML">CityGML 3.0</option><option value="Supporto">Schemi importati (GML, ISO 19139, xAL, XLink)</option><option value="all">Tutti gli schemi</option></select>
      <div class="filter-row"><label for="module" class="sr-only">Modulo</label><select id="module"><option value="">Tutti i moduli</option></select><button class="icon-button" id="filters-btn" aria-expanded="false" aria-controls="extra-filters" title="Altri filtri">&#9776;</button></div>
      <div id="extra-filters" class="extra-filters" hidden>
        <label for="category" class="sr-only">Categoria</label>
        <select id="category"><option value="">Tutte le categorie</option><option value="topLevel">Oggetti di primo livello</option><option value="cityObject">Oggetti di citt&agrave;</option><option value="space">Oggetti di citt&agrave;: spazi</option><option value="boundary">Oggetti di citt&agrave;: superfici di confine</option><option value="feature">Feature</option><option value="object">Oggetti (non feature)</option><option value="datatype">Tipi di dato</option><option value="enumeration">Enumerazioni</option><option value="codelist">Code list</option><option value="codelistFilled">Code list con valori</option><option value="codelistMissing">Code list da compilare</option></select>
        <label><input type="checkbox" id="technical"> Tipi tecnici e punti ADE</label>
        <label><input type="checkbox" id="only-concrete"> Solo concreti (istanziabili)</label>
        <label><input type="checkbox" id="include-external"> Riferimenti esterni</label>
      </div>
    </div>
    <div class="list-heading"><span>CONCETTI</span><span id="results-count" class="count">0</span></div>
    <nav id="concept-list" class="concept-list" aria-label="Elenco dei concetti"></nav>
    <div class="sidebar-footer"><span class="status-dot"></span><span>Catalogo locale &middot; nessun server</span><button id="options-btn" title="Opzioni di visualizzazione" aria-label="Opzioni di visualizzazione" aria-expanded="false" aria-controls="options-panel">&#9881;</button><button id="about-btn" title="Guida e legenda" aria-label="Guida e legenda">?</button>
      <div id="options-panel" class="options-panel" role="dialog" aria-label="Opzioni di visualizzazione" hidden>
        <div class="options-row"><span>Dimensione del testo</span><div class="options-group"><button type="button" data-font-step="-1" aria-label="Riduci il testo">A&minus;</button><span id="font-scale-value" class="options-value">100%</span><button type="button" data-font-step="1" aria-label="Ingrandisci il testo">A+</button></div></div>
        <div class="options-row"><span>Tema</span><div class="options-group" role="radiogroup" aria-label="Tema"><button type="button" role="radio" data-theme-choice="light">Chiaro</button><button type="button" role="radio" data-theme-choice="dark">Scuro</button><button type="button" role="radio" data-theme-choice="system">Sistema</button></div></div>
      </div>
    </div>
  </aside>
  <div class="main-shell">
    <header class="topbar">
      <div class="topbar-left"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="Apri elenco concetti" aria-expanded="false">&#9776;</button><button class="icon-button" id="back-btn" title="Indietro" aria-label="Indietro">&#8592;</button><button class="icon-button" id="forward-btn" title="Avanti" aria-label="Avanti">&#8594;</button><div id="breadcrumb" class="breadcrumb"></div></div>
      <div class="topbar-right"><span class="local-badge"><span class="status-dot"></span><span id="catalog-version">Catalogo locale</span></span><button class="text-button" id="codelists-btn" title="Code list con valori nel dizionario locale">Code list <span id="codelist-count"></span></button><button class="text-button" id="sources-btn">Sorgenti <span id="file-count"></span></button></div>
    </header>
    <main id="content" tabindex="-1"><div class="loading">Caricamento del catalogo locale...</div></main>
    <noscript>Per navigare il catalogo occorre abilitare JavaScript. Gli schemi XSD sono disponibili nella cartella sources.</noscript>
  </div>
</div>
<dialog id="modal"><div class="modal-header"><h2 id="modal-title"></h2><button class="icon-button" id="close-modal" aria-label="Chiudi">&#215;</button></div><div id="modal-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
